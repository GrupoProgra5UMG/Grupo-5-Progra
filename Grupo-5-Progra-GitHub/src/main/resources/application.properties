# =========================
# Base de datos MySQL
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citas_medicas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:cambia_esto_por_una_clave_larga_y_secreta_para_firmar_los_tokens_jwt}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# Servidor
# =========================
server.port=${PORT:8080}
